<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<section th:fragment="userBanner">
<!-- Header Banner -->
			<div
				class="bg-success text-white d-flex flex-column flex-md-row justify-content-between align-items-center p-5">
				<h3 class="m-0 mb-3 mb-md-0">
					<i class="fas fa-user me-2"></i>Dashboard
				</h3>

				<!-- Search Bar -->
				<div class="input-group" style="max-width: 300px;">
					<input type="text" class="form-control" placeholder="Search..."
						aria-label="Search" />
					<button class="btn btn-success" type="button">Search</button>
				</div>
			</div>
</section>
</body>
</html>
